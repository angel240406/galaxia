<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Universo Eres Tú 💛</title>
    <!-- Cargamos Three.js de un servidor ultra seguro compatible con GitHub -->
    <script src="https://cloudflare.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030209;
            font-family: 'Arial', sans-serif;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Frases que flotan en el espacio elíptico */
        .love-text {
            position: absolute;
            color: #fffde7;
            font-weight: bold;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.9), 0 0 20px rgba(255, 145, 0, 0.7);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            font-size: 0.95rem;
        }

        /* Título principal superior */
        .title-overlay {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="title-overlay">Te amo</div>
    <div id="labels-container"></div>
    <div id="canvas3d"></div>

    <script>
        const container = document.getElementById('canvas3d');
        const labelsContainer = document.getElementById('labels-container');
        
        // Espacio Tridimensional
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030209, 0.02);

        // Cámara con inclinación perfecta tipo galaxia espiral
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 38);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const frases = [
            "Te amo chaparrita linda", "Mi girasol 🌻", "Para siempre ✨", 
            "Te Amo", "Eres mi universo", "Mi niña hermosa", "Siempre juntos", "Mi girasol"
        ];

        // --- POLVO DE ESTRELLAS DORADAS (DENSO Y NEBULOSO) ---
        const count = 30000; // Mucha densidad para recrear el gas de tu imagen
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        const colorCore = new THREE.Color('#fff099'); // Centro oro brillante
        const colorEdge = new THREE.Color('#ff4500'); // Brazos naranja fuego

        for(let i = 0; i < count; i++) {
            const i3 = i * 3;
            
            // Logaritmo para espiral de dos brazos perfectos
            const r = Math.pow(Math.random(), 2.2) * 35;
            const arms = 2; 
            const angle = ((i % arms) / arms) * Math.PI * 2 + r * 0.25 + (Math.random() - 0.5) * 0.45;

            positions[i3]     = Math.cos(angle) * r + (Math.random() - 0.5) * (r * 0.15);
            positions[i3 + 1] = (Math.random() - 0.5) * (2.0 / (r * 0.1 + 1)); 
            positions[i3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * (r * 0.15);

            const mixedColor = colorCore.clone();
            mixedColor.lerp(colorEdge, r / 35);
            
            colors[i3]     = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.18,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const galaxyPoints = new THREE.Points(geometry, material);
        scene.add(galaxyPoints);

        // --- NÚCLEO GALÁCTICO CENTRADO ---
        const core = new THREE.Mesh(
            new THREE.SphereGeometry(2.2, 32, 32), 
            new THREE.MeshBasicMaterial({ color: 0xffea00, transparent: true, opacity: 0.95 })
        );
        scene.add(core);

        // --- CÓDIGO DE LAS FLORES AMARILLAS ---
        const objectsData = [];
        const numFlores = 32;

        const flowerGroupBase = new THREE.Group();
        const centerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 8), new THREE.MeshBasicMaterial({ color: 0x211003 }));
        centerMesh.rotation.x = Math.PI / 2;
        flowerGroupBase.add(centerMesh);
        
        const petalGeo = new THREE.BoxGeometry(0.15, 0.65, 0.03);
        const petalMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        for(let j=0; j<12; j++) {
            const petal = new THREE.Mesh(petalGeo, petalMat);
            petal.position.set(Math.cos(j * Math.PI / 6) * 0.4, Math.sin(j * Math.PI / 6) * 0.4, 0);
            petal.rotation.z = (j * Math.PI / 6) + Math.PI / 2;
            flowerGroupBase.add(petal);
        }

        for(let i = 0; i < numFlores; i++) {
            const flowerCopy = flowerGroupBase.clone();
            
            const r = Math.random() * 22 + 4;
            const angle = Math.random() * Math.PI * 2;
            flowerCopy.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * 0.8, Math.sin(angle) * r);
            
            const scale = Math.random() * 0.5 + 0.5;
            flowerCopy.scale.set(scale, scale, scale);
            scene.add(flowerCopy);

            // Letreros interactivos HTML
            const label = document.createElement('div');
            label.className = 'love-text';
            label.innerText = frases[Math.floor(Math.random() * frases.length)];
            labelsContainer.appendChild(label);

            objectsData.push({
                mesh: flowerCopy,
                label: label,
                radius: r,
                angle: angle,
                speed: (0.007 / (r * 0.1 + 1)) + 0.001,
                rotSpeed: Math.random() * 0.02 + 0.01
            });
        }

        // --- ANIMACIÓN ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            galaxyPoints.rotation.y = elapsedTime * 0.04;

            objectsData.forEach(obj => {
                obj.angle += obj.speed;
                obj.mesh.position.x = Math.cos(obj.angle) * obj.radius;
                obj.mesh.position.z = Math.sin(obj.angle) * obj.radius;
                obj.mesh.rotation.z += obj.rotSpeed;

                // Las flores miran siempre de frente a la cámara de forma estética
                obj.mesh.lookAt(camera.position);

                // Mapear plano 3D a pantalla 2D
                const vector = obj.mesh.position.clone();
                vector.project(camera);

                if(vector.z > 1) {
                    obj.label.style.opacity = 0;
                } else {
                    obj.label.style.opacity = 1;
                    const x = (vector.x *  .5 + .5) * window.innerWidth;
                    const y = (vector.y * -.5 + .5) * window.innerHeight;
                    obj.label.style.left = `${x}px`;
                    obj.label.style.top = `${y}px`;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
